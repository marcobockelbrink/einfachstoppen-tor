<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">Aufbau der Strecke von oben</title>
  <desc id="d">Links der Sender, rechts das Tor, dazwischen der Infrarotstrahl. Ein Läufer kreuzt den Strahl im rechten Winkel.</desc>
  <defs>
    <marker id="pf" markerUnits="userSpaceOnUse" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#63bc8a"/>
    </marker>
  </defs>
  <rect width="1000" height="400" fill="#0e1316"/>

  <!-- Laufweg -->
  <rect x="400" y="20" width="160" height="270" fill="#192024" stroke="#354046" stroke-dasharray="6 6"/>
  <text x="480" y="42" font-size="13" text-anchor="middle" fill="#92a2aa">Laufweg</text>

  <!-- Sender -->
  <rect x="50" y="130" width="110" height="80" rx="10" fill="#192024" stroke="#354046" stroke-width="2"/>
  <circle cx="160" cy="170" r="9" fill="#62aeda"/>
  <text x="100" y="166" font-size="18" font-weight="600" text-anchor="middle" fill="#e4e9ec">Sender</text>
  <text x="100" y="188" font-size="13" text-anchor="middle" fill="#92a2aa">IR-LED</text>

  <!-- Tor -->
  <rect x="840" y="130" width="110" height="80" rx="10" fill="#192024" stroke="#354046" stroke-width="2"/>
  <rect x="832" y="160" width="12" height="20" fill="#62aeda"/>
  <text x="900" y="166" font-size="18" font-weight="600" text-anchor="middle" fill="#e4e9ec">Tor</text>
  <text x="900" y="188" font-size="13" text-anchor="middle" fill="#92a2aa">TSOP</text>

  <!-- Strahl -->
  <line x1="172" y1="170" x2="828" y2="170" stroke="#62aeda" stroke-width="4" stroke-dasharray="3 7"/>

  <!-- Läufer -->
  <circle cx="480" cy="170" r="16" fill="#ea7b6d"/>
  <line x1="480" y1="270" x2="480" y2="210" stroke="#63bc8a" stroke-width="3" marker-end="url(#pf)"/>
  <text x="464" y="262" font-size="13" text-anchor="end" fill="#63bc8a">Laufrichtung</text>

  <!-- Abstand -->
  <g stroke="#92a2aa" stroke-width="1.5" fill="none">
    <path d="M172 318 V338 M828 318 V338 M172 328 H828"/>
  </g>
  <text x="500" y="316" font-size="14" text-anchor="middle" fill="#e4e9ec">Abstand: Datenblatt „24 m typisch“ (Labor, dunkel). Draußen nachmessen.</text>

  <text x="500" y="372" font-size="13" text-anchor="middle" fill="#92a2aa">Der Strahl liegt quer zum Laufweg, etwa in Hüfthöhe. Beide Geräte stehen auf Stativen, ohne Sonne im Fenster.</text>
</svg>
