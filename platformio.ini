; einfachstoppen Tor -- Firmware fuer einen ESP32-C3 (BLE).
;
;   pio run -e schreibtisch -t upload    Der BOOT-Taster (GPIO 9) ist der Sensor. Zum Testen ohne Aufbau.
;   pio run -e tor -t upload             Lichtschranke an GPIO 4, Strahl unterbrochen = Pegel HIGH.
;   pio run -e tor_modul -t upload       Fertige Lichtschranke mit Open-Collector-Ausgang (z. B. Adafruit
;                                        Break Beam) an GPIO 4. Strahl unterbrochen = Pegel HIGH.
;   pio run -e tor_start -t upload       Wie "tor", meldet aber Starts statt Ziele.
;   pio run -e startstab -t upload       Startstab: Reedkontakt an GPIO 4 gegen GND, Oeffnen = Start.
;
; Die Bibliothek ist auf eine Hauptversion festgelegt: NimBLE-Arduino 2.x hat eine
; andere Schnittstelle als 1.4, die Firmware ist gegen 1.4 geschrieben.

[env]
platform = espressif32@^6.9.0
framework = arduino
board = esp32-c3-devkitm-1
monitor_speed = 115200
lib_deps = h2zero/NimBLE-Arduino@^1.4.3
build_src_filter = +<*> -<sender.cpp>
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DTOR_VERSION=\"0.1.0\"

; Die Gegenstelle der Lichtschranke: ein zweiter ESP32-C3, der nur Bursts sendet.
[env:sender]
build_src_filter = -<*> +<sender.cpp>
build_flags =
    ${env.build_flags}
    -DSENDER_PIN=5

[env:schreibtisch]
build_flags =
    ${env.build_flags}
    -DTOR_PIN=9
    -DTOR_FLANKE=FALLING
    -DTOR_PULLUP=1
    -DTOR_ART=0
    -DTOR_MODUS=0

; TOR_MODUS=1: Impulszug eines TSOP-Empfaengers (active low). Der Sender (env "sender")
; schickt Bursts; ein Durchgang ist, dass sie aufhoeren. TOR_FLANKE gilt hier nicht.
[env:tor]
build_flags =
    ${env.build_flags}
    -DTOR_PIN=4
    -DTOR_FLANKE=FALLING
    -DTOR_PULLUP=0
    -DTOR_ART=0
    -DTOR_MODUS=1

; Fertige Lichtschranke, Sender und Empfaenger getrennt (z. B. Adafruit Break Beam, 3,3-5,5 V).
; Der Empfaenger schaltet bei freiem Strahl nach GND (LOW), bei unterbrochenem laesst er den Pin los
; und der Pullup zieht ihn auf HIGH -- also ist die steigende Flanke der Durchgang. Der interne
; Pullup genuegt bei kurzem Kabel; bei langem einen 10-kOhm-Widerstand nach 3V3 dazu.
; Kein Sender-Board noetig: die Sende-LED des Moduls haengt nur an 3V3 und GND.
; Ungeprueft am Geraet.
[env:tor_modul]
build_flags =
    ${env.build_flags}
    -DTOR_PIN=4
    -DTOR_FLANKE=RISING
    -DTOR_PULLUP=1
    -DTOR_ART=0
    -DTOR_MODUS=0

[env:tor_start]
build_flags =
    ${env.build_flags}
    -DTOR_PIN=4
    -DTOR_FLANKE=FALLING
    -DTOR_PULLUP=0
    -DTOR_ART=1
    -DTOR_MODUS=1

; TOR_MODUS=2: Reedkontakt am Startstab. Zu (Magnet nah) = LOW, Stange aufgedrueckt = HIGH.
; Ein Start zaehlt nur, wenn der Kontakt zuvor TOR_SCHARF_MS am Stueck zu war.
[env:startstab]
build_flags =
    ${env.build_flags}
    -DTOR_PIN=4
    -DTOR_FLANKE=CHANGE
    -DTOR_PULLUP=1
    -DTOR_ART=1
    -DTOR_MODUS=2
    -DTOR_OFFEN_PEGEL=1
    -DTOR_SCHARF_MS=100
